<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Fat Loss Knowledge Graph Tests</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f4f4f1;
        color: #1f2933;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 32px;
        letter-spacing: -0.03em;
      }

      h2 {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid #d8d8d0;
        font-size: 22px;
      }

      h3 {
        margin-top: 0;
        font-size: 18px;
      }

      p {
        line-height: 1.5;
      }

      pre {
        overflow-x: auto;
        padding: 16px;
        background: #111827;
        color: #f9fafb;
        border-radius: 10px;
      }

      .loading {
        padding: 24px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
      }

      strong {
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <main id="test-output">
      <section class="loading">
        <h1>Fat Loss Knowledge Graph Tests</h1>
        <p>Loading test runner...</p>
      </section>
    </main>

    <script type="module" src="./browserTestRunner.js"></script>
  </body>
</html>
