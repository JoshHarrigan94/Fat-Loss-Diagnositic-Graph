<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagnostic Scenario Library</title>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f4f1;
        color: #1f2933;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 32px;
        letter-spacing: -0.03em;
      }

      .lede {
        color: #4b5563;
      }

      .summary {
        display: flex;
        gap: 20px;
        margin: 24px 0;
        padding: 16px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
      }

      .card {
        margin-bottom: 16px;
        padding: 20px;
        background: white;
        border: 1px solid #ddd;
        border-left: 6px solid #999;
        border-radius: 12px;
      }

      .card.pass {
        border-left-color: #15803d;
      }

      .card.fail {
        border-left-color: #b91c1c;
      }

      .failures {
        padding: 12px;
        background: #fff1f2;
        border: 1px solid #fecdd3;
        border-radius: 8px;
      }

      pre {
        overflow-x: auto;
        padding: 16px;
        background: #111827;
        color: #f9fafb;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <main id="scenario-output">
      <h1>Diagnostic Scenario Library</h1>
      <p>Loading scenarios...</p>
    </main>

    <script type="module" src="./scenarioBrowserRunner.js"></script>
  </body>
</html>
